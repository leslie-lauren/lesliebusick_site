<!DOCTYPE html>
<html><head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=JetBrains+Mono:wght@500;600&display=swap');
body { margin: 0; }
.og {
  width: 1200px; height: 630px;
  background: #f7f2e9;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(166, 61, 34, 0.06), transparent 50%),
    radial-gradient(circle at 75% 70%, rgba(166, 61, 34, 0.05), transparent 50%);
  font-family: 'Newsreader', Georgia, serif;
  color: #0f0d0b;
  padding: 70px 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-sizing: border-box;
  position: relative;
}
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: #d94f30;
  font-weight: 600;
}
.name {
  font-size: 200px;
  font-weight: 400;
  line-height: 0.9;
  letter-spacing: -0.035em;
  margin: 60px 0 30px;
}
.name em { font-style: italic; color: #d94f30; }
.tagline {
  font-size: 30px;
  line-height: 1.4;
  color: #2a2622;
  max-width: 900px;
}
.tagline em { font-style: italic; color: #d94f30; }
.footer {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #8a8270;
  border-top: 1px solid #e2d8c0;
  padding-top: 24px;
}
.footer .accent { color: #d94f30; font-weight: 600; }
</style></head>
<body>
<div class="og">
  <div class="eyebrow">— FOUNDER · OPERATOR · ADVISOR · NYC</div>
  <div>
    <div class="name">Hi, I'm<br><em>Leslie</em>.</div>
    <div class="tagline">2x founder, operator, advisor, and generally <em>just try to be helpful!</em></div>
  </div>
  <div class="footer">
    <span>lesliebusick.com</span>
    <span class="accent">leslie@lesliebusick.com</span>
  </div>
</div>
</body></html>
